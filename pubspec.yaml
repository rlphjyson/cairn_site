name: cairn_site
description: The marketing and documentation site for Cairn UI, built with Cairn UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  # The whole point of this repository: the site's own chrome — nav, buttons,
  # cards, tabs, tables, dialogs — is built from the library it documents.
  #
  # Caret-pinned to the 0.2 line, so a library regression shows up here only
  # when the lockfile is deliberately bumped.
  # The sample apps live in their own packages under templates/, so each one
  # can be copied out and used on its own. The site only mounts them.
  cairn_template_auth:
    path: templates/auth
  cairn_template_blog:
    path: templates/blog
  cairn_template_chat:
    path: templates/chat
  cairn_template_dashboard:
    path: templates/dashboard
  cairn_template_docs:
    path: templates/docs
  cairn_template_landing:
    path: templates/landing
  cairn_template_onboarding:
    path: templates/onboarding
  cairn_template_shop:
    path: templates/shop
  cairn_ui: ^0.2.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  # For usePathUrlStrategy(); see the comment in lib/main.dart.
  flutter_web_plugins:
    sdk: flutter
  # Pinned below 18.x deliberately: go_router 18 pulls flutter_localizations,
  # intl, material_ui and cupertino_ui into the graph, which is dead weight in a
  # web bundle for a site that ships one locale and no Cupertino widgets.
  go_router: ^17.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/screenshots/

  fonts:
    # Geist is the typeface Cairn's golden tests are pinned to. Bundling it
    # here means the site renders with the same metrics the library's goldens
    # were captured against instead of whatever sans-serif the visitor's
    # browser happens to default to.
    #
    # SIL Open Font License 1.1 — see fonts/OFL.txt and NOTICE.md.
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
