name: cairn_template_jaspr_store
description: >-
  A server-rendered online store built with Jaspr and the Cairn design language:
  full SSR, structured data, a no-JavaScript cart and checkout, and a clean
  architecture with a single stand-in backend to replace.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  jaspr: ^0.23.4
  shelf: ^1.4.0
  shelf_gzip: ^4.1.0
  get_it: ^8.0.0
  crypto: ^3.0.0
  meta: ^1.15.0
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  # Pinned: >=4.8.1 requires Dart >=3.13.0-107.0.dev.
  build_web_compilers: ">=4.8.0 <4.8.1"
  jaspr_builder: ^0.23.4
  jaspr_test: ^0.23.4
  html: ^0.15.4
  lints: ^5.0.0
  test: ^1.25.0

jaspr:
  mode: server
  port: 8080
