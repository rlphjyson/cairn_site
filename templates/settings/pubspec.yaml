name: cairn_template_settings
description: Mobile settings screens built only from cairn_ui. A searchable home, profile, appearance, notifications, privacy, storage, help and a danger zone, with clean architecture, flutter_bloc and get_it.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  cairn_ui: ^0.2.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
