name: cairn_template_dashboard
description: An analytics dashboard built from cairn_ui and fl_chart. Clean architecture, flutter_bloc and get_it.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  cairn_ui: ^0.2.0
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
