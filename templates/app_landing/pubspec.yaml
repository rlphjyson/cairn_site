name: cairn_template_app_landing
description: A mobile app landing page built only from cairn_ui. Clean architecture, flutter_bloc and get_it.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  cairn_ui: ^0.2.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
