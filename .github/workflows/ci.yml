name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned rather than tracking `stable`, for the same reason cairn_ui pins it:
# this repository builds against a library whose appearance is locked by golden
# images, and a Flutter upgrade can change text shaping. Bumping the toolchain
# should be a deliberate commit, not something that happens overnight.
env:
  FLUTTER_VERSION: 3.44.0

jobs:
  verify:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      # Each template is its own package with its own pubspec, analysis and
      # tests; the root analyzer excludes templates/.
      - name: Templates (analyze and test)
        run: |
          for pkg in templates/*/; do
            echo "::group::$pkg"
            if grep -q '^  jaspr:' "$pkg/pubspec.yaml"; then
              # A server-rendered Jaspr app: plain Dart, with generated options.
              (cd "$pkg" && dart pub get && dart run build_runner build --delete-conflicting-outputs && dart analyze --fatal-infos && dart test)
            else
              (cd "$pkg" && flutter pub get && flutter analyze --fatal-infos --fatal-warnings && flutter test)
            fi
            echo "::endgroup::"
          done

      # The served copies of the template docs must match their sources.
      - name: Template docs are in sync
        run: |
          bash tool/sync_template_docs.sh
          git diff --exit-code web/template-docs

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The same command the deploy workflow runs, so a broken release build
      # fails on a pull request rather than on main.
      - name: Build release bundle
        run: flutter build web --release --base-href /cairn_site/
